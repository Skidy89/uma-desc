<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Impact&display=swap"
      rel="stylesheet"
    />

    <title>uma desc!</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="body">
    <div class="loading" aria-label="Loading" role="status">
      <div class="loading-spinner"></div>
    </div>
    <div class="title-container" hidden>
      <h1 class="title-text">Choose your <span class="title-highlight">uma</span></h1>
    </div>

    <main id="app" hidden>
      <div class="card" id="meisho" style="background-color: #17131d;">
        <div class="wrapper">
          <img
            src="/images/meisho/doto.jpg"
            class="cover-image"
            alt="Character background"
          />
        </div>

        <img
          src="/images/meisho/doto-nobg.png"
          class="character"
          alt="Character"
        />
      </div>
      <div class="card" id="oguri" style="background-color: #111;">
        <div class="wrapper">
          <img
            src="/images/oguri/charbg.jpg"
            class="cover-image"
            alt="Character background"
          />
        </div>

        <img
          src="/images/oguri/nobg.png"
          class="character"
          alt="Character"
        />
      </div>
      <div class="card" id="doto3">
        <div class="wrapper">
          <img
            src="/images/meisho/doto.jpg"
            class="cover-image"
            alt="Character background"
          />
        </div>

        <img
          src="/images/meisho/doto-nobg.png"
          class="character"
          alt="Character"
        />
      </div>
      <div class="card" id="doto4">
        <div class="wrapper">
          <img
            src="/images/meisho/doto.jpg"
            class="cover-image"
            alt="Character background"
          />
        </div>

        <img
          src="/images/meisho/doto-nobg.png"
          class="character"
          alt="Character"
        />
      </div>

      <section class="card-details" id="character-info" hidden>
        <h1 class="info-name">Meisho doto</h1>
        <p class="info-description">
          Meisho doto is a character from the popular game Uma Musume Pretty Derby. She is known for her speed and agility on the racetrack, making her a favorite among fans of the game.
          This card will redirect you to her page, with a chatbot where you can talk with her.
        </p>
        <button class="card-btn" type="button">
          <img src="/images/meisho/MeishoChibi1.webp" alt="" class="card-btn-img">
          continue
        </button>
      </section>

    </main>

    <script type="module" src="html.js"></script>
  </body>
</html>
