<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Impact&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/images/icon.svg" />
    <meta name="description" content="Browse Uma Musume character profiles and discover more about your favorites." />
    <meta
      name="keywords"
      content="uma, uma musume, uma musume pretty derby, uma musume game, uma musume anime"
    />
    <meta name="author" content="skidy89" />
    <title>Uma Desc — Character Profiles</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="body">
    <div class="loading" aria-label="Loading" role="status">
      <div class="loading-spinner">
        <div class="loading-t">Loading...</div>
      </div>
    </div>
    <div class="title-container" hidden>
      <h1 class="title-text">
        Choose your <span class="title-highlight">uma</span>
      </h1>
    </div>

    <main id="app" hidden>
      <div class="card" id="meisho" role="button" tabindex="0" aria-label="Choose Meisho Doto" style="background-color: #17131d">
        <div class="wrapper">
          <img
            src="/images/meisho/doto.jpg"
            class="cover-image"
            alt="Meisho Doto at dusk"
            loading="lazy"
          />
        </div>

        <img
          src="/images/meisho/doto-nobg.png"
          class="character"
          alt="Meisho Doto"
          loading="lazy"
        />
      </div>
      <div class="card" id="oguri" role="button" tabindex="0" aria-label="Choose Oguri Cap" style="background-color: #111">
        <div class="wrapper">
          <img
            src="/images/oguri/charbg.jpg"
            class="cover-image"
            alt="Oguri Cap character artwork"
            loading="lazy"
          />
        </div>

        <img
          src="/images/oguri/nobg.png"
          class="character"
          alt="Oguri Cap"
          loading="lazy"
        />
      </div>
      <div class="card" id="goldship" role="button" tabindex="0" aria-label="Choose Gold Ship" style="background-color: #110101">
        <div class="wrapper">
          <img
            src="/images/goldship/bg.jpg"
            class="cover-image"
            alt="Gold Ship character artwork"
            loading="lazy"
          />
        </div>

        <img
          src="/images/goldship/nobg.png"
          class="character"
          alt="Gold Ship"
          loading="lazy"
        />
      </div>
      <div class="card" id="doto4" role="button" tabindex="0" aria-label="Choose Meisho Doto" style="background-color: #17131d">
        <div class="wrapper">
          <img
            src="/images/meisho/doto.jpg"
            class="cover-image"
            alt="Meisho Doto at dusk"
            loading="lazy"
          />
        </div>

        <img
          src="/images/meisho/doto-nobg.png"
          class="character"
          alt="Meisho Doto"
          loading="lazy"
        />
      </div>

      <section class="card-details" id="character-info" hidden>
        <h1 class="info-name"></h1>
        <p class="info-description"></p>
        <button class="card-btn" type="button">
          <img
            src="/images/meisho/MeishoChibi1.webp"
            alt=""
            class="card-btn-img"
          />
          Continue
        </button>
      </section>
    </main>

    <script type="module" src="html.js"></script>
  </body>
</html>
